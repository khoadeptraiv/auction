services:
  # 1. Frontend - Static Site
  - type: web
    name: auction-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://auction-backend.onrender.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # 2. Backend - Monolith (Go)
  - type: web
    name: auction-backend
    runtime: go
    plan: free
    rootDir: apps/backend
    buildCommand: go build -o auction-server main.go
    startCommand: ./auction-server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-db
          property: connectionString
      - key: REDIS_URL
        sync: false # External Redis
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false

databases:
  # 3. Database - Managed PostgreSQL
  - name: auction-db
    plan: free
    region: oregon
    databaseName: auction_db
    user: auction