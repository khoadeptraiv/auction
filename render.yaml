services:
  # 1. Frontend - Chuyển sang type: static (Luôn miễn phí, không bao giờ tốn tiền)
  - type: static
    name: auction-web
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist # Đường dẫn sau build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://auction-backend.onrender.com
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false

  # 2. Backend - Phải dùng Runtime ngôn ngữ (ví dụ Node) thay vì Docker để dùng gói Free
  - type: web
    name: auction-backend
    plan: free
    runtime: node # ĐỔI TỪ DOCKER SANG NODE
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-db
          property: connectionString
      - key: REDIS_URL # Lấy từ Upstash hoặc Redis Cloud vì Render không có Redis free
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false

# 3. Database - Phải dùng khối riêng này để có gói Free 90 ngày
databases:
  - name: auction-db
    plan: free
    region: oregon