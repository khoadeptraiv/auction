services:
  # Frontend - Cấu hình đúng cho Static Site
  - type: web              # PHẢI là web
    name: auction-web
    runtime: static        # Đây mới là chỗ để xác định nó là Static Site
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: apps/web/dist 
    rootDir: apps/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend - Phải dùng Runtime ngôn ngữ (ví dụ Node) thay vì Docker để dùng gói Free
  - type: web
    name: auction-backend
    plan: free
    runtime: node # ĐỔI TỪ DOCKER SANG NODE
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: auction-db
          property: connectionString
      - key: REDIS_URL # Lấy từ Upstash hoặc Redis Cloud vì Render không có Redis free
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLERK_SECRET_KEY
        sync: false

# 3. Database - Phải dùng khối riêng này để có gói Free 90 ngày
databases:
  - name: auction-db
    plan: free
    region: oregon